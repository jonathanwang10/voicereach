[pytest]
testpaths = backend/tests
addopts = --strict-markers
markers =
    real_embedding_task: run the real generate_embedding_background (OpenAI/Supabase must be mocked)
    real_auth: run with real token verification instead of the fake test user
    real_query_embedding: run the real EmbeddingService.embed_query (OpenAI must be mocked)
    real_record_embedding: run the real EmbeddingService.embed_record (OpenAI must be mocked)
    db: needs a local Postgres with the schema applied (VOICEREACH_TEST_DB_URL); see backend/tests/db/
asyncio_mode = auto
# No blanket ignores: warnings show in the summary. Building a real Supabase client
# (it warns about its deprecated timeout/verify arguments) means a test is about to do
# network I/O, so that warning fails the test.
filterwarnings =
    error:The 'timeout' parameter is deprecated:DeprecationWarning
