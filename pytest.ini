[pytest]
testpaths = backend/tests
markers =
    integration: needs a running backend, Supabase and OpenAI (set VOICEREACH_INTEGRATION=1)
    real_embedding_task: run the real generate_embedding_background (OpenAI/Supabase must be mocked)
    real_auth: run with real token verification instead of the fake test user
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
